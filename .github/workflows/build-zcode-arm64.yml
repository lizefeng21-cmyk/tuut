name: Build ZCode Linux ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'

      - name: Build official ZCode
        run: |
          test "$(uname -m)" = aarch64
          npm install -g pnpm@10.33.2
          git clone --depth 1 --branch v3.17.2 https://github.com/zai-org/ZCode.git
          cd ZCode
          pnpm install --frozen-lockfile
          pnpm build:zcode --base-url https://downloads.example.com/zcode/

      - uses: actions/upload-artifact@v4
        with:
          name: zcode-linux-arm64
          path: |
            ZCode/dist/zcode/releases/*/zcode-*.tar.gz
            ZCode/dist/zcode/releases/*/sha256.txt
          if-no-files-found: error
