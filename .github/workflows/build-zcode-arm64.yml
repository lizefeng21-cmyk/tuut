name: Build ZCode Linux ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'

      - name: Clone ZCode and install dependencies
        shell: bash
        run: |
          test "$(uname -m)" = aarch64
          npm install -g pnpm@10.33.2
          git clone --depth 1 --branch v3.17.2 https://github.com/zai-org/ZCode.git
          cd ZCode

          install_cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[-,]/); print cpus[1] }' /proc/self/status)"
          test -n "$install_cpu"
          taskset -c "$install_cpu" pnpm install --frozen-lockfile

      - name: Build TUI workspace dependencies
        shell: bash
        working-directory: ZCode
        run: |
          pnpm --filter @zcode/model-option-map exec tsc --noCheck --rewriteRelativeImportExtensions
          pnpm --filter @zcode/shared exec tsc --noCheck --allowJs --rewriteRelativeImportExtensions

          test -s packages/model-option-map/dist/index.js
          test -s packages/shared/dist/index.js

          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';

          for (const name of ['model-option-map', 'shared']) {
            const path = `packages/${name}/package.json`;
            const pkg = JSON.parse(readFileSync(path, 'utf8'));

            for (const field of ['exports', 'imports']) {
              for (const [key, value] of Object.entries(pkg[field] ?? {})) {
                if (typeof value === 'string' && value.startsWith('./src/')) {
                  pkg[field][key] = value
                    .replace('./src/', './dist/')
                    .replace(/\.ts$/, '.js');
                }
              }
            }

            writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          }
          JS

      - name: Package ZCode CLI and TUI
        shell: bash
        working-directory: ZCode
        run: pnpm build:zcode --base-url https://downloads.example.com/zcode/

      - name: Verify archive checksum
        shell: bash
        working-directory: ZCode/dist/zcode/releases/3.17.2
        run: sha256sum -c sha256.txt

      - name: Upload offline installation package
        uses: actions/upload-artifact@v4
        with:
          name: zcode-linux-arm64
          path: |
            ZCode/dist/zcode/releases/3.17.2/zcode-3.17.2.tar.gz
            ZCode/dist/zcode/releases/3.17.2/sha256.txt
          if-no-files-found: error
